# ScreenForge release: tag vX.Y.Z → publish + Velopack pack → GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (ör. 1.1.2) — boşsa csproj Version"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}".Trim()
          if (-not $v -and $env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(.+)$') {
            $v = $Matches[1]
          }
          if (-not $v) {
            [xml]$csproj = Get-Content -Encoding UTF8 "ScreenForge/ScreenForge.csproj"
            $v = ($csproj.Project.PropertyGroup.Version | Select-Object -First 1).ToString().Trim()
          }
          if (-not $v) { throw "Sürüm bulunamadı" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $v"

      - name: Sync csproj Version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $path = "ScreenForge/ScreenForge.csproj"
          $xml = Get-Content $path -Raw
          $xml = [regex]::Replace($xml, '<Version>[^<]+</Version>', "<Version>$v</Version>")
          Set-Content -Path $path -Value $xml -Encoding utf8 -NoNewline

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Add dotnet tools to PATH
        shell: pwsh
        run: echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Package (publish + Velopack)
        shell: pwsh
        run: |
          ./scripts/package-velopack.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          $notesFile = New-TemporaryFile
          @"
          ## ScreenForge $tag

          ### Yenilikler
          - Bölgesel ekran seçiminden **Google Translate Images** çevirisi
          - Çeviri sonucu: Ctrl+C ile resim kopyala ve kapat
          - Hedef dile özel durum metni + spinner (ör. Türkçeye çevriliyor…)
          - Çeviri motoru ısınması ve sayfa yeniden kullanımı (daha hızlı başlama)
          - Native çözünürlükle Google tarayıcı kalitesine yakın metin yerleşimi

          ### Kurulum
          - **Setup:** ScreenForge-win-Setup.exe (önerilen, otomatik güncelleme)
          - **Portable:** ScreenForge-win-Portable.zip
          "@ | Set-Content -Path $notesFile -Encoding utf8

          $assets = Get-ChildItem "Releases" -File | ForEach-Object { $_.FullName }
          if (-not $assets) { throw "Releases/ boş — paketleme başarısız" }
          Write-Host "Assets:"
          $assets | ForEach-Object { Write-Host " - $_" }

          $view = gh release view $tag 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "ScreenForge $tag" --notes-file $notesFile --latest
          }
